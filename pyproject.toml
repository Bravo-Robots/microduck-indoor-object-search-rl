[project]
name = "microduck-indoor-object-search-rl"
version = "0.2.1"
description = "Object-search training and physical rehearsal for MicroDuck"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["torch==2.9.1", "numpy==2.4.1", "mujoco==3.10.0", "onnxruntime==1.24.4", "onnx==1.22.0", "Pillow==12.2.0", "imageio==2.37.2", "imageio-ffmpeg==0.6.0", "protobuf==6.33.6", "better-actuator-models"]

[tool.uv.sources]
better-actuator-models = {git = "https://github.com/Rhoban/bam.git", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967"}

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["third_party", ".blender-venv", ".blender-venv311"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
